<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>塔罗占卜</title>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@600;700&family=Noto+Serif+SC:wght@400;600;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <div class="ambient-glow"></div>
  <div class="stars-bg"></div>

  <header class="hero">
    <div class="badge">ARCANA ENGINE · V2</div>
    <h1>星 寰 全 书</h1>
    <p class="subtitle">STELLAR TAROT ORACLE</p>
  </header>

  <main class="container">
    <!-- 意图与自定义问题 -->
    <section class="query-card glass">
      <div class="intent-pills" id="intent-pills">
        <button class="pill active" data-intent="工作">💼 工作事业</button>
        <button class="pill" data-intent="爱情">💞 情感关系</button>
        <button class="pill" data-intent="学习">📚 学业成长</button>
        <button class="pill" data-intent="综合">🌌 综合指引</button>
      </div>
      <input type="text" id="question-input" maxlength="80" placeholder="默念你的具体困惑（选填，留空则按所选领域推演）...">
    </section>

    <!-- 三牌阵舞台 -->
    <section class="spread-grid">
      <div class="slot" data-index="0">
        <div class="slot-meta"><span>前因</span><small>PAST</small></div>
        <div class="card-3d" id="card-0">
          <div class="card-face card-back"><span class="sigil">✧</span></div>
          <div class="card-face card-front">
            <div class="card-emoji" id="emoji-0"></div>
            <div class="card-name" id="name-0"></div>
            <div class="card-pos" id="pos-0"></div>
          </div>
        </div>
      </div>

      <div class="slot" data-index="1">
        <div class="slot-meta"><span>当下</span><small>PRESENT</small></div>
        <div class="card-3d" id="card-1">
          <div class="card-face card-back"><span class="sigil">✧</span></div>
          <div class="card-face card-front">
            <div class="card-emoji" id="emoji-1"></div>
            <div class="card-name" id="name-1"></div>
            <div class="card-pos" id="pos-1"></div>
          </div>
        </div>
      </div>

      <div class="slot" data-index="2">
        <div class="slot-meta"><span>后果</span><small>FUTURE</small></div>
        <div class="card-3d" id="card-2">
          <div class="card-face card-back"><span class="sigil">✧</span></div>
          <div class="card-face card-front">
            <div class="card-emoji" id="emoji-2"></div>
            <div class="card-name" id="name-2"></div>
            <div class="card-pos" id="pos-2"></div>
          </div>
        </div>
      </div>
    </section>

    <p class="hint-text" id="hint-text">静心凝神，点击下方按钮开启星门</p>

    <!-- 操作按钮 -->
    <div class="action-bar">
      <button class="btn-primary" id="start-btn">开启星门 · 抽取三牌</button>
      <button class="btn-gold hidden" id="interpret-btn">✦ 召唤星象解读</button>
    </div>

    <!-- AI 解读输出面板 -->
    <section class="insight-box glass hidden" id="insight-panel">
      <div class="insight-header">
        <span>✦ 命运之书启示 ✦</span>
        <button class="btn-text" id="reset-btn">重占一局 ↺</button>
      </div>
      <div class="insight-body" id="insight-text"></div>
    </section>
  </main>

  <!-- 悬浮牌库入口 -->
  <button class="fab-lib" id="open-lib-btn" title="查看78张全书牌库">牌库</button>

  <!-- 78张牌库抽屉 -->
  <div class="overlay hidden" id="lib-overlay">
    <div class="lib-top">
      <div class="lib-title-row">
        <span>✦ 星寰全书（78张）</span>
        <button class="btn-text" id="close-lib-btn">关闭 ✕</button>
      </div>
      <input type="search" id="lib-search" placeholder="搜索牌名或花色（如：愚者、圣杯、逆位）...">
    </div>
    <div class="lib-grid" id="lib-grid"></div>
  </div>

  <!-- 单牌详情弹窗 -->
  <div class="modal-backdrop hidden" id="detail-modal">
    <div class="modal-card glass">
      <div class="modal-emoji" id="modal-emoji"></div>
      <h3 class="modal-title" id="modal-title"></h3>
      <p class="modal-desc" id="modal-desc"></p>
      <div class="modal-advice">
        <strong>✦ 指引：</strong>
        <span id="modal-advice"></span>
      </div>
      <div class="modal-actions">
        <button class="btn-outline" id="toggle-pos-btn">切换正逆位 ↺</button>
        <button class="btn-text" id="close-modal-btn">收起</button>
      </div>
    </div>
  </div>

  <script type="module" src="./app.js"></script>
</body>
</html>
